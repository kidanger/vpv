name: macos

on: [push]

env:
  BUILD_TYPE: Debug

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false

    steps:
    - uses: actions/checkout@v2

    - name: Install dependencies
      shell: bash
      run: brew install sdl3 rust #dylibbundler

    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/build

    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/build
      run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DBUILD_TESTING=ON

    - name: Build
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: cmake --build . --config $BUILD_TYPE -v

    - name: Test
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: ctest --output-on-failure

  package-macos:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v2
      with:
        submodules: recursive

    - name: Install dependencies
      shell: bash
      run: brew install sdl3 rust dylibbundler

    - name: Build (Release)
      shell: bash
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release -j$(sysctl -n hw.logicalcpu)

    - name: Create .app bundle
      shell: bash
      run: |
        chmod +x package/make_app_bundle.sh
        package/make_app_bundle.sh build/vpv.app

    - name: Create DMG
      shell: bash
      run: |
        chmod +x package/make_dmg.sh
        package/make_dmg.sh build/vpv.app dist

    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: vpv-macos-dmg
        path: dist/vpv.dmg
        if-no-files-found: error

    - name: Upload DMG to release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/vpv.dmg
